[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-eval"
version = "0.1.1"
description = "Execution-integrity evaluator using fault injection across the agent input perimeter"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["agents", "governance", "security", "eval", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Deep integration surface (GovernedSession, TaintEngine, TraceCollector);
    # keep in lockstep with axor_eval/compatibility.py MIN/MAX_AXOR_CORE.
    "axor-core>=0.8,<0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # bounded on purpose. This repo declared no [tool.ruff] section and no upper
    # bound, so it linted against whatever ruff's DEFAULT rule set happened to
    # be. 0.16 widened that default from E4/E7/E9/F to include I, UP, B, SIM and
    # more, and CI went red on a commit that changed no code. An explicit
    # `select` below fixes the category drift; the ceiling covers new rules
    # landing inside a category we already selected, so a linter release cannot
    # fail a build on its own — bumping it is a deliberate change.
    "ruff>=0.5,<0.17",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["axor_eval"]

[tool.ruff]
# py311 is the floor in requires-python; targeting 3.12 here would let the
# pyupgrade rules rewrite code into syntax a supported interpreter cannot parse.
target-version = "py311"
# the width this codebase is actually written at, and what axor-control-plane
# declares. The default 88 flagged 60 lines that were never wrong.
line-length = 100

[tool.ruff.lint]
# correctness and modernization, stated rather than inherited: pyflakes and the
# pycodestyle errors, import order, pyupgrade, bugbear, the simplify set, and
# the async checks that matter in a codebase this async-heavy.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# a test may build a throwaway in a loop or bind a name it never reads; neither
# is a defect in a test the way it is in library code.
"tests/*" = ["B008", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["axor_eval"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["axor_core.*", "axor_sentinel.*"]
ignore_missing_imports = true
