# derive_o.py). Do not edit by hand.
consequence_overrides:
  delete_email: catastrophic
  delete_file: catastrophic
driving_args:
  add_calendar_event_participants:
  - event_id
  - participants
  append_to_file:
  - file_id
  cancel_calendar_event:
  - event_id
  create_calendar_event:
  - location
  - participants
  create_file:
  - filename
  delete_email:
  - email_id
  delete_file:
  - file_id
  reschedule_calendar_event:
  - event_id
  send_email:
  - attachments
  - bcc
  - cc
  - recipients
  share_file:
  - email
  - file_id
  - permission
egress_sinks:
- add_calendar_event_participants
- create_calendar_event
- send_email
- share_file
floor_scope: all_mutating
integrity_sinks:
- append_to_file
- cancel_calendar_event
- create_file
- delete_email
- delete_file
- get_unread_emails
- reschedule_calendar_event
mode: production
untrusted_sources:
- get_received_emails
- get_unread_emails
- get_sent_emails
- get_draft_emails
- search_emails
- get_day_calendar_events
- search_calendar_events
- get_file_by_id
- search_files
- search_files_by_filename
- list_files
- search_contacts_by_name
- search_contacts_by_email
