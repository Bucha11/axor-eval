# config_p11/travel.yaml with O as operator_sets (residuals_rules.md revision 12;
# derive_p12.py). Do not edit by hand.
driving_args:
  cancel_calendar_event:
  - event_id
  create_calendar_event:
  - end_time
  - location
  - participants
  - start_time
  reserve_car_rental:
  - company
  - end_time
  - start_time
  reserve_hotel:
  - end_day
  - hotel
  - start_day
  reserve_restaurant:
  - restaurant
  - start_time
  send_email:
  - attachments
  - bcc
  - cc
  - recipients
egress_sinks:
- create_calendar_event
- send_email
floor_scope: all_mutating
integrity_sinks:
- cancel_calendar_event
- reserve_car_rental
- reserve_hotel
- reserve_restaurant
mode: production
